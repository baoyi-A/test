<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test</title>
<style>
  :root{
    --ink:#1d2733; --muted:#5d6b7c; --ground:#edf0f4; --card:#ffffff;
    --navy:#1f3a5f; --navy2:#2e5a86; --amber:#a14908; --amber2:#c96a1e;
    --gold:#b9892f; --line:#d7dee6; --bad:#b3403a; --ok:#2e7d4f;
  }
  @media (prefers-color-scheme: dark){ :root{
    --ink:#e8ecf1; --muted:#9aa7b5; --ground:#141a22; --card:#1d2630;
    --navy:#7fa8d4; --navy2:#5c86b4; --amber:#e0a35c; --amber2:#d98f3e;
    --gold:#d4a648; --line:#33404f; --bad:#e07a74; --ok:#63b98a;
  }}
  :root[data-theme="dark"]{
    --ink:#e8ecf1; --muted:#9aa7b5; --ground:#141a22; --card:#1d2630;
    --navy:#7fa8d4; --navy2:#5c86b4; --amber:#e0a35c; --amber2:#d98f3e;
    --gold:#d4a648; --line:#33404f; --bad:#e07a74; --ok:#63b98a;
  }
  :root[data-theme="light"]{
    --ink:#1d2733; --muted:#5d6b7c; --ground:#edf0f4; --card:#ffffff;
    --navy:#1f3a5f; --navy2:#2e5a86; --amber:#a14908; --amber2:#c96a1e;
    --gold:#b9892f; --line:#d7dee6; --bad:#b3403a; --ok:#2e7d4f;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--ground);color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;}
  /* gate */
  #gatewrap{min-height:100vh;display:grid;place-items:center;padding:24px}
  .gate{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:34px 32px 30px;box-shadow:0 18px 40px rgba(15,30,50,.14);}
  .crest{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--navy),var(--navy2));
    display:grid;place-items:center;margin:0 auto 16px;}
  h1{margin:0;text-align:center;font-size:1.35rem;letter-spacing:.2px}
  .sub{margin:8px 0 24px;text-align:center;color:var(--muted);font-size:.92rem;line-height:1.55}
  label{display:block;font-size:.78rem;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--muted);margin:0 0 6px}
  .row{display:flex;gap:10px}
  input[type=password]{flex:1;min-width:0;font-size:1.05rem;padding:11px 14px;border-radius:10px;
    border:1.5px solid var(--line);background:transparent;color:var(--ink);outline:none;
    letter-spacing:2px;transition:border-color .15s}
  input[type=password]:focus{border-color:var(--navy2)}
  button{font-size:.95rem;font-weight:700;padding:11px 20px;border:0;border-radius:10px;cursor:pointer;
    background:var(--navy);color:#fff;transition:transform .15s,opacity .15s}
  button:hover{transform:translateY(-1px)}
  button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  button[disabled]{opacity:.55;cursor:wait;transform:none}
  .msg{min-height:1.5em;margin:12px 0 0;text-align:center;font-size:.9rem;color:var(--muted)}
  .msg.err{color:var(--bad);font-weight:600}
  .gate.shake{animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  @media (prefers-reduced-motion:reduce){.gate.shake{animation:none}}
  .foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);text-align:center;
    color:var(--muted);font-size:.78rem;line-height:1.6}
  /* hub */
  #hub{display:none;max-width:760px;margin:0 auto;padding:30px 18px 70px}
  .hubhead{border-radius:18px;color:#fff;padding:26px 26px 22px;box-shadow:0 12px 28px rgba(15,30,50,.22)}
  .hubhead.navy{background:linear-gradient(135deg,#1f3a5f,#2e5a86)}
  .hubhead.amber{background:linear-gradient(135deg,#8a3d06,#c96a1e)}
  .hubhead.teal{background:linear-gradient(135deg,#0d4a52,#1e8794)}
  .hubhead.viol{background:linear-gradient(135deg,#3a0f3f,#8a2d82 70%,#b0459e)}
  .hubhead.lawn{background:linear-gradient(135deg,#24503c,#2f6b4f 55%,#5e3350)}
  .hubhead.crim{background:linear-gradient(135deg,#6d1626,#a4243b 60%,#37505c)}
  .hubhead.game{background:linear-gradient(135deg,#16302e,#2c5a50 58%,#8a6d2f)}
  .hubhead .hi{font-size:.85rem;letter-spacing:1.6px;text-transform:uppercase;opacity:.85;margin:0 0 4px}
  .hubhead h2{margin:0;font-size:1.45rem;line-height:1.2}
  .progressrow{display:flex;align-items:center;gap:14px;margin-top:16px}
  .pbar{flex:1;height:10px;border-radius:6px;background:rgba(255,255,255,.25);overflow:hidden}
  .pbar>div{height:100%;border-radius:6px;background:#ffd97a;width:0;transition:width .8s ease}
  .pct{font-weight:800;font-size:.95rem;font-variant-numeric:tabular-nums}
  .maplist{margin:22px 0 0;padding:0;list-style:none}
  .maplist li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:11px 14px;margin:8px 0;font-size:.95rem}
  .maplist .n{flex:0 0 34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:800;
    font-variant-numeric:tabular-nums;font-size:.9rem}
  .maplist li.done .n{background:var(--ok);color:#fff}
  .maplist li.open .n{background:var(--gold);color:#fff}
  .maplist li.future{opacity:.5}
  .maplist li.future .n{background:var(--line);color:var(--muted)}
  .maplist .emoji{flex:0 0 auto;font-size:1.15rem;width:1.5em;text-align:center}
  .maplist li.future .emoji{filter:grayscale(1);opacity:.7}
  .maplist .t{flex:1}
  .maplist li.open .t:after{content:"  ← up next";color:var(--gold);font-weight:700;font-size:.82rem}
  .maplist li.clickable{cursor:pointer;transition:transform .12s,box-shadow .12s}
  .maplist li.clickable:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(15,30,50,.12)}
  .farm3d{flex:0 0 auto;font:inherit;font-size:.74rem;font-weight:700;padding:4px 9px;border-radius:14px;border:1px solid var(--line);background:#fff;color:#7a5a1a;cursor:pointer}
  .farm3d:hover{background:#fff4d6;border-color:#d8b46a}
  .maplist .go{flex:0 0 auto;font-size:.8rem;font-weight:700;color:var(--navy2)}
  .tick{flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:2px solid var(--line);
    background:transparent;color:transparent;font-size:1rem;font-weight:800;line-height:1;
    cursor:pointer;padding:0;display:grid;place-items:center;transition:all .15s}
  .tick:hover{border-color:var(--ok)}
  .tick.on{background:var(--ok);border-color:var(--ok);color:#fff;animation:pop .3s}
  @keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){.tick.on{animation:none}}
  .milestone{margin:8px 0 0;font-size:.85rem;font-weight:600;color:#ffd97a;opacity:.95}
  .hubfoot{margin-top:18px;text-align:center;color:var(--muted);font-size:.8rem}
  /* overlay */
  #overlay{display:none;position:fixed;inset:0;z-index:100;background:var(--ground)}
  #overlay iframe{width:100%;height:100%;border:0}
  #backbtn{position:fixed;top:12px;right:14px;z-index:101;display:none;
    background:rgba(20,30,45,.85);color:#fff;border:0;border-radius:10px;padding:9px 16px;
    font-weight:700;font-size:.88rem;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.3)}
  #backbtn:hover{background:rgba(20,30,45,1)}
</style>
<div id="gatewrap">
  <div class="gate" id="gate">
    <div class="crest" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
      </svg>
    </div>
    <h1>Test</h1>
    <form id="form">
      <label for="pw">Password</label>
      <div class="row">
        <input type="password" id="pw" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Password">
        <button type="submit" id="go" disabled>Loading…</button>
      </div>
    </form>
    <p class="msg" id="msg"></p>
  </div>
</div>
<script>
  form.onsubmit=function(){ if(!window.__ready){ msg.textContent="Almost there — the page is still loading. Try again in a few seconds."; msg.className="msg"; return false; } };
</script>

  var ITER=150000;
  function b2u(b64){var s=atob(b64),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
  function hex2u(h){var u=new Uint8Array(h.length/2);for(var i=0;i<u.length;i++)u[i]=parseInt(h.substr(i*2,2),16);return u;}
  async function decPw(pw, blob){
    var raw=b2u(blob), salt=raw.slice(0,16), iv=raw.slice(16,28), data=raw.slice(28);
    var km=await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:ITER,hash:"SHA-256"}, km,
      {name:"AES-GCM",length:256}, false, ["decrypt"]);
    return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:iv}, key, data));
  }
  async function decKey(hexkey, blob){
    var raw=b2u(blob), iv=raw.slice(0,12), data=raw.slice(12);
    var key=await crypto.subtle.importKey("raw", hex2u(hexkey), {name:"AES-GCM"}, false, ["decrypt"]);
    return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:iv}, key, data));
  }

  var form=document.getElementById("form"), pwEl=document.getElementById("pw"),
      msg=document.getElementById("msg"), go=document.getElementById("go"), gate=document.getElementById("gate"),
      hub=document.getElementById("hub"), gatewrap=document.getElementById("gatewrap"),
      overlay=document.getElementById("overlay"), frame=document.getElementById("frame"),
      backbtn=document.getElementById("backbtn");

  function render(man){
    gatewrap.style.display="none"; hub.style.display="block";
    var total=man.map.length;
    var storeKey="bp_"+man.name+"_"+man.course.replace(/W+/g,"");
    var doneSet={};
    man.done.forEach(function(n){doneSet[n]=1;});
    try{ (JSON.parse(localStorage.getItem(storeKey)||"[]")).forEach(function(n){doneSet[n]=1;}); }catch(e){}
    function doneArr(){ return Object.keys(doneSet).map(Number).sort(function(a,b){return a-b;}); }
    function save(){ try{ localStorage.setItem(storeKey, JSON.stringify(doneArr())); }catch(e){} }
    function milestoneText(p){
      if(p>=100) return "All done — take a bow! 🏆";
      if(p>=75)  return "The end is in sight!";
      if(p>=50)  return "Past the halfway mark 🎉";
      if(p>=25)  return "Real momentum now.";
      if(p>0)    return "Off to a good start.";
      return "Your journey starts here.";
    }
    var head=document.createElement("div");
    head.className="hubhead "+({navy:"navy",amber:"amber",teal:"teal",viol:"viol",lawn:"lawn",crim:"crim"}[man.theme]||"navy");
    head.innerHTML='<p class="hi">Welcome back, '+man.name+'</p><h2>'+man.course+'</h2>'+
      '<div class="progressrow"><div class="pbar"><div id="pfill"></div></div><span class="pct" id="pct"></span></div>'+
      '<p class="milestone" id="mile"></p>';
    hub.appendChild(head);
    function refreshBar(){
      var dc=doneArr().length, pct=Math.round(dc/total*100);
      document.getElementById("pct").textContent=dc+" / "+total+" · "+pct+"%";
      document.getElementById("mile").textContent=milestoneText(pct);
      document.getElementById("pfill").style.width=pct+"%";
    }
    var ul=document.createElement("ul"); ul.className="maplist";
    var nextFound=false;
    man.map.forEach(function(row){
      var n=row[0], title=row[1], id=row[2], emoji=row[3]||"";
      var li=document.createElement("li");
      var hasKey=id && man.keys[id];
      var isDone=!!doneSet[n];
      function cls(){
        if(doneSet[n]) return "done"+(hasKey?" clickable":"");
        if(hasKey && !nextFound){ return "open clickable"; }
        return "future"+(hasKey?" clickable":"");
      }
      if(!isDone && hasKey && !nextFound){ li.className="open clickable"; nextFound=true; }
      else li.className=(isDone?"done":"future")+(hasKey?" clickable":"");
      li.innerHTML='<span class="n">'+n+'</span><span class="emoji">'+emoji+'</span><span class="t">'+title+'</span>'+
        (hasKey?'<span class="go">open →</span>':'');
      // self-service progress tick
      var tick=document.createElement("button");
      tick.type="button"; tick.className="tick"+(isDone?" on":""); tick.textContent="✓";
      tick.setAttribute("aria-label","Mark "+n+" as done");
      tick.addEventListener("click",function(e){
        e.stopPropagation();
        if(doneSet[n]){ delete doneSet[n]; tick.classList.remove("on"); li.classList.remove("done"); if(!hasKey)li.classList.add("future"); }
        else { doneSet[n]=1; tick.classList.add("on"); li.classList.remove("future","open"); li.classList.add("done"); }
        save(); refreshBar();
      });
      li.appendChild(tick);
      // some rows get a small 🚜 that opens the 3D view
      var farmId="af3d";
      if(man.keys[farmId] && id!==farmId && n>0){
        var farm=document.createElement("button");
        farm.type="button"; farm.className="farm3d"; farm.textContent="🚜 3D";
        farm.title="Open 3D view";
        farm.addEventListener("click",function(e){ e.stopPropagation(); openId(farmId, n, li); });
        li.appendChild(farm);
      }
      async function openId(oid, ln, el){
        el.style.opacity=.6;
        try{
          var k=man.keys[oid];
          var html=await decKey(k.k, await getD(k.i));
          // srcdoc has no ?query; the 3D page reads this global first
          if(ln) html='<scr'+'ipt>window.FARM_LESSON='+(+ln)+';</scr'+'ipt>'+html;
          frame.srcdoc=html;
          overlay.style.display="block"; backbtn.style.display="block";
          document.body.style.overflow="hidden";
        }catch(e){ alert("Could not open this."); }
        el.style.opacity=1;
      }
      if(hasKey){
        li.setAttribute("tabindex","0"); li.setAttribute("role","button");
        var launch=function(){ openId(id, 0, li); };
        li.addEventListener("click",launch);
        li.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){e.preventDefault();launch();} });
      }
      ul.appendChild(li);
    });
    hub.appendChild(ul);
    var f=document.createElement("p"); f.className="hubfoot";
    f.textContent="Tap ✓ to mark done (saved on this device) · dim items are still being written.";
    hub.appendChild(f);
    requestAnimationFrame(function(){ setTimeout(refreshBar,60); });
  }

  backbtn.addEventListener("click",function(){
    overlay.style.display="none"; backbtn.style.display="none";
    frame.srcdoc=""; document.body.style.overflow="";
  });

  form.addEventListener("submit", async function(e){
    e.preventDefault();
    var pw=pwEl.value.trim(); if(!pw) return;
    go.setAttribute("disabled",""); msg.className="msg"; msg.textContent="Unlocking…";
    var man=null;
    for(var i=0;i<D2.length;i++){
      try{ man=JSON.parse(await decPw(pw,D2[i])); break; }catch(err){}
    }
    if(man){ render(man); }
    else{
      go.removeAttribute("disabled");
      msg.className="msg err"; msg.textContent="Wrong password.";
      gate.classList.add("shake"); setTimeout(function(){gate.classList.remove("shake");},400);
      pwEl.select();
    }
  });
  pwEl.focus();
})();
</script>
